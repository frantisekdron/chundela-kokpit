<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zakázky — Chundela Reality × František Dron</title>
<meta name="theme-color" content="#14120f">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zakázky">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314120f'/%3E%3Crect x='6' y='11' width='13' height='7.3' rx='1' fill='%23d2ba8a'/%3E%3Crect x='21' y='9' width='5' height='8.9' rx='1' fill='none' stroke='%23d2ba8a' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-hledat" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-obnovit" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-krizek" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-prehrat" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-foto" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8.5 6l1.2-2h4.6l1.2 2"/></symbol>
  <symbol id="i-kostka" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
  <symbol id="i-odkaz" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-komentar" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.2-2.9A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-tuzka" viewBox="0 0 24 24"><path d="M16.5 4.5l3 3L8 19l-4 1 1-4z"/></symbol>
  <symbol id="i-kos" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-fajfka" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
</defs></svg>

<!-- ZÁMEK -->
<div class="zamek" id="zamek">
  <div class="zamek-panel">
    <svg class="zamek-znak" width="58" height="58" viewBox="0 0 62 62" aria-hidden="true">
      <rect x="0.5" y="0.5" width="61" height="61" rx="13" fill="none" stroke="#3d3937"/>
      <rect x="12" y="22" width="25" height="14" rx="1.5" fill="#d2ba8a"/>
      <rect x="41" y="18" width="9" height="16" rx="1.5" fill="none" stroke="#d2ba8a" stroke-width="1.6"/>
    </svg>
    <h1>Zakázky<br><span>Chundela Reality&nbsp;× František&nbsp;Dron</span></h1>
    <p class="zamek-popis">Zadej heslo, které jsi dostal. Zůstane uložené v tomhle prohlížeči.</p>
    <form id="zamek-form">
      <input type="password" id="zamek-heslo" placeholder="Heslo" autocomplete="current-password" required>
      <button type="submit" id="zamek-btn">Otevřít</button>
      <p class="zamek-chyba" id="zamek-chyba" role="alert"></p>
    </form>
  </div>
</div>

<!-- APLIKACE -->
<div id="app" class="skryto">
  <header class="topbar">
    <div class="topbar-in">
      <div class="znacka">
        <svg width="28" height="28" viewBox="0 0 62 62" aria-hidden="true">
          <rect x="0.5" y="0.5" width="61" height="61" rx="13" fill="none" stroke="#3d3937"/>
          <rect x="12" y="22" width="25" height="14" rx="1.5" fill="#d2ba8a"/>
          <rect x="41" y="18" width="9" height="16" rx="1.5" fill="none" stroke="#d2ba8a" stroke-width="1.6"/>
        </svg>
        <span class="znacka-text">Chundela&nbsp;× František&nbsp;Dron</span>
      </div>
      <div class="hledani">
        <svg class="icon"><use href="#i-hledat"/></svg>
        <input type="search" id="hledat" placeholder="Hledat zakázku…" aria-label="Hledat zakázku">
      </div>
      <div class="top-akce">
        <button class="ikonbtn" id="btn-obnovit" title="Načíst znovu" aria-label="Načíst znovu"><svg class="icon"><use href="#i-obnovit"/></svg></button>
        <button class="ikonbtn avatar-btn" id="btn-role" title="Změnit podpis"><span class="avatar" id="me-avatar">FD</span></button>
      </div>
    </div>
  </header>

  <main>
    <nav class="ovladani">
      <div class="zalozky" role="tablist">
        <button class="zalozka" role="tab" data-filtr="aktivni" aria-selected="true">Aktivní <b id="p-aktivni">0</b></button>
        <button class="zalozka" role="tab" data-filtr="hotove" aria-selected="false">Hotové <b id="p-hotove">0</b></button>
      </div>
      <button class="btn-nova" id="btn-nova"><svg class="icon"><use href="#i-plus"/></svg> Nová zakázka</button>
    </nav>
    <section id="plocha"></section>
  </main>

  <div class="zaves" id="zaves"></div>
  <aside class="suplik" id="suplik" aria-hidden="true" aria-label="Detail zakázky"></aside>
</div>

<div class="hlasky" id="hlasky" role="status" aria-live="polite"></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <div class="dlg-hlava">
      <h3 id="dlg-titulek"></h3>
      <p id="dlg-popis" class="skryto"></p>
    </div>
    <div class="dlg-telo" id="dlg-telo"></div>
    <div class="dlg-pata">
      <button type="button" class="btn-tichy" id="dlg-zrusit">Zrušit</button>
      <button type="submit" class="btn-hlavni" id="dlg-ok">Uložit</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>

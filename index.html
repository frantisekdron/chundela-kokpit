<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produkční kokpit — Chundela Reality × František Dron</title>
<meta name="theme-color" content="#14120f">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kokpit">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314120f'/%3E%3Crect x='6' y='11' width='13' height='7.3' rx='1' fill='%23d2ba8a'/%3E%3Crect x='21' y='9' width='5' height='8.9' rx='1' fill='none' stroke='%23d2ba8a' stroke-width='1.4'/%3E%3Crect x='6' y='21' width='20' height='2' rx='1' fill='%233d3937'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ikony -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-hledat" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-obnovit" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-fajfka" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
    <symbol id="i-krizek" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-prehrat" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-odkaz" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-foto" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.4"/><path d="M8.5 6l1.2-2h4.6l1.2 2"/></symbol>
    <symbol id="i-kostka" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
    <symbol id="i-inzerat" viewBox="0 0 24 24"><path d="M3 10.5L12 4l9 6.5"/><path d="M5.5 12v8h13v-8"/></symbol>
    <symbol id="i-slozka" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-komentar" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.2-2.9A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-ukol" viewBox="0 0 24 24"><path d="M4 7l2.5 2.5L11 5"/><path d="M4 17l2.5 2.5L11 15"/><path d="M14 8h6M14 18h6"/></symbol>
    <symbol id="i-kalendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-tuzka" viewBox="0 0 24 24"><path d="M16.5 4.5l3 3L8 19l-4 1 1-4z"/></symbol>
    <symbol id="i-kos" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-karty" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
    <symbol id="i-sloupce" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="14" rx="1.5"/></symbol>
    <symbol id="i-radky" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-blesk" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
    <symbol id="i-zpet" viewBox="0 0 24 24"><path d="M10 5l-7 7 7 7"/><path d="M3 12h13a5 5 0 0 1 0 10h-2"/></symbol>
  </defs>
</svg>

<!-- ============================ ZÁMEK ============================ -->
<div class="zamek" id="zamek">
  <div class="zamek-panel">
    <svg class="zamek-znak" width="62" height="62" viewBox="0 0 62 62" aria-hidden="true">
      <rect x="0.5" y="0.5" width="61" height="61" rx="13" fill="none" stroke="#3d3937"/>
      <rect x="12" y="21" width="25" height="14" rx="1.5" fill="#d2ba8a"/>
      <rect x="41" y="17" width="9" height="16" rx="1.5" fill="none" stroke="#d2ba8a" stroke-width="1.6"/>
      <rect x="12" y="41" width="38" height="3" rx="1.5" fill="#3d3937"/>
    </svg>
    <h1>Produkční kokpit<br><span>Chundela Reality × František Dron</span></h1>
    <p class="zamek-popis">Zadej heslo, které jsi dostal. Zůstane uložené v tomhle prohlížeči.</p>
    <form id="zamek-form">
      <input type="password" id="zamek-heslo" placeholder="Heslo" autocomplete="current-password" required>
      <button type="submit" id="zamek-btn">Otevřít kokpit</button>
      <p class="zamek-chyba" id="zamek-chyba" role="alert"></p>
    </form>
    <p class="zamek-pata">Neveřejné. Všechno, co se tu změní, se ukládá s podpisem a časem.</p>
  </div>
</div>

<!-- ============================ APLIKACE ============================ -->
<div id="app" class="skryto">

  <header class="topbar">
    <div class="topbar-in">
      <div class="znacka">
        <svg width="30" height="30" viewBox="0 0 62 62" aria-hidden="true">
          <rect x="0.5" y="0.5" width="61" height="61" rx="13" fill="none" stroke="#3d3937"/>
          <rect x="12" y="21" width="25" height="14" rx="1.5" fill="#d2ba8a"/>
          <rect x="41" y="17" width="9" height="16" rx="1.5" fill="none" stroke="#d2ba8a" stroke-width="1.6"/>
          <rect x="12" y="41" width="38" height="3" rx="1.5" fill="#3d3937"/>
        </svg>
        <span class="znacka-text">Produkční kokpit<i>Chundela × František Dron</i></span>
      </div>

      <div class="hledani">
        <svg class="icon"><use href="#i-hledat"/></svg>
        <input type="search" id="hledat" placeholder="Hledat zakázku…" aria-label="Hledat zakázku">
      </div>

      <div class="top-akce">
        <button class="ikonbtn" id="btn-aktivita" title="Poslední změny" aria-label="Poslední změny">
          <svg class="icon"><use href="#i-blesk"/></svg>
        </button>
        <button class="ikonbtn" id="btn-obnovit" title="Načíst znovu" aria-label="Načíst znovu">
          <svg class="icon"><use href="#i-obnovit"/></svg>
        </button>
        <button class="role-chip" id="btn-role">
          <span class="avatar" id="me-avatar">FD</span>
          <span id="me-jmeno">Franta</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- volací list -->
    <section class="volacilist" id="volacilist">
      <div class="vl-hlava">
        <h2>Volací list</h2>
        <span class="vl-datum" id="vl-datum"></span>
      </div>
      <div class="vl-sloupce">
        <div class="vl-sloupec">
          <div class="vl-titulek nas">Čeká na studio <span class="vl-pocet" id="vl-pocet-studio">0</span></div>
          <div id="vl-studio"></div>
        </div>
        <div class="vl-sloupec">
          <div class="vl-titulek vas">Čeká na Chundela Reality <span class="vl-pocet" id="vl-pocet-klient">0</span></div>
          <div id="vl-klient"></div>
        </div>
      </div>
    </section>

    <!-- ovládání -->
    <nav class="ovladani">
      <div class="zalozky" role="tablist" id="zalozky">
        <button class="zalozka" role="tab" data-filtr="aktivni" aria-selected="true">Aktivní <b id="p-aktivni">0</b></button>
        <button class="zalozka" role="tab" data-filtr="archiv" aria-selected="false">Archiv <b id="p-archiv">0</b></button>
        <button class="zalozka" role="tab" data-filtr="vse" aria-selected="false">Vše <b id="p-vse">0</b></button>
        <button class="zalozka" role="tab" data-filtr="kos" aria-selected="false">Koš <b id="p-kos">0</b></button>
      </div>

      <button class="filtr-me" id="filtr-me" aria-pressed="false">
        <svg class="icon"><use href="#i-ukol"/></svg> Jen co čeká na mě
      </button>

      <div class="prepinac" role="group" aria-label="Zobrazení">
        <button data-pohled="karty" aria-pressed="true"><svg class="icon"><use href="#i-karty"/></svg><span>Karty</span></button>
        <button data-pohled="faze" aria-pressed="false"><svg class="icon"><use href="#i-sloupce"/></svg><span>Fáze</span></button>
        <button data-pohled="seznam" aria-pressed="false"><svg class="icon"><use href="#i-radky"/></svg><span>Seznam</span></button>
      </div>

      <button class="btn-nova" id="btn-nova"><svg class="icon"><use href="#i-plus"/></svg> Nová zakázka</button>
    </nav>

    <section id="plocha"></section>
  </main>

  <!-- detail -->
  <div class="zaves" id="zaves"></div>
  <aside class="suplik" id="suplik" aria-hidden="true" aria-label="Detail zakázky"></aside>
</div>

<div class="hlasky" id="hlasky" role="status" aria-live="polite"></div>

<!-- dialog: obecný formulář -->
<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <div class="dlg-hlava">
      <h3 id="dlg-titulek"></h3>
      <p id="dlg-popis" class="skryto"></p>
    </div>
    <div class="dlg-telo" id="dlg-telo"></div>
    <div class="dlg-pata">
      <button type="button" class="btn-tichy" id="dlg-zrusit">Zrušit</button>
      <button type="submit" class="btn-hlavni" id="dlg-ok">Uložit</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
